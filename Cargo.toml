[package]
name = "ash"
version = "0.1.0"
edition = "2024"

[dependencies]
genai = "0.7.0-beta.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
crossterm = "0.28"
shlex = "1"
which = "6"

[dev-dependencies]
tempfile = "3"
